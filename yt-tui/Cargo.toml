[package]
name = "yt-tui"
version = "0.2.0"
edition = "2021"

# yt-tui — search and watch YouTube in the terminal.
# yt-dlp finds the streams, ffmpeg decodes video into raw frames that reach
# kitty through shared memory, mpv plays the audio and is the master clock.
[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
libc = "0.2"
