[package]
name = "lwp"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = [
    "AVPlayer",
    "AVPlayerItem",
    "AVAnimation",
    "objc2-quartz-core",
    "objc2-core-media",
] }
objc2-core-media = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
