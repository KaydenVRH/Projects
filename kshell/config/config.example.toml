# The line drawn inside the screen edges — the bar's glass carried around the
# screen, in the same style as the media centre's surface. It stops at the bar
# (it never crosses it) and lives in your window manager's outer gap.
[border]
# Toggle at runtime with `kshell trigger border_toggle`.
enabled   = true
# The frame fills from the screen's edge inward; inset + thickness is how thick
# it ends up, and radius rounds its inner opening. The bar sits inside that
# opening (its margins are raised to match), and the frame, bar and media centre
# share one material view so their junctions are seamless.
inset     = 5
thickness = 3
radius    = 20
color     = "$background"  # tokens work here; try "$accent" for a brighter frame
blur      = true         # frost the frame with whatever is behind it

# The music panel (trigger with `kshell trigger music_launcher_toggle`, or
# `music_play_library` to start the whole library). Searches YouTube Music and
# downloads through yt-dlp; playback happens inside kshell, so the bar's
# now-playing widget and the media centre both follow it.
[music]
directory      = "~/Music/kshell"   # where downloads land
search_results = 15                  # results per search
format         = "m4a"               # yt-dlp's audio container
ytdlp          = "yt-dlp"
# The audio visualiser: cava-style bars along the bottom of the screen that rise
# while music plays and fade away when it stops. Purely decoration — it ignores
# the mouse. `layer = "overlay"` keeps it above ordinary windows (visible over
# tiled ones); `layer = "background"` puts it on the desktop behind them.
# Toggle at runtime with `kshell trigger visualiser_toggle`.
[visualiser]
enabled = true
layer   = "background" # overlay | background
layout  = "centered"    # centered (mirrored) | sweep (low->high)
bars    = 64            # bands; centered draws each one twice
height  = 140           # how tall the bars can get, in points
gap     = 2             # gap between bars
inset   = 0             # extra gap above the frame's bottom edge
opacity = 0.8
mirror  = 0.35          # reflection under the baseline; 0 turns it off
fade    = 0.5           # seconds to fade in and out
display = "all"         # all | main
